<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El taller del chocolate - Elecciones de productos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #000000;
      padding: 16px;
    }

    .widget-box {
      border: 1px solid #000000;
      border-radius: 10px;
      padding: 16px;
      background: #000000;
    }

    .poll-title {
      font-size: 16px;
      font-weight: 700;
      color: #d4a373;
      margin-bottom: 12px;
    }

    .option-btn {
      position: relative;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .option-btn:hover:not(.disabled) {
      border-color: #d4a373;
    }

    .option-btn.disabled {
      cursor: default;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #d4a373;
      width: 0%;
      transition: width 0.4s ease;
      z-index: 1;
    }

    .option-label, .option-stats {
      position: relative;
      z-index: 2;
      font-size: 14px;
      font-weight: 600;
      color: #d4a373;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      color: #d4a373;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="widget-box">
    <h4 class="poll-title">Votación de productos de El taller del chocolate.</h4>

    <div class="option-btn" data-id="opt1">
      <div class="progress-bar" id="bar-opt1"></div>
      <span class="option-label">Barra de chocolate combinado.</span>
      <span class="option-stats hidden" id="stats-opt1">0% (0)</span>
    </div>

    <div class="option-btn" data-id="opt2">
      <div class="progress-bar" id="bar-opt2"></div>
      <span class="option-label">Bola de chocolate negro.</span>
      <span class="option-stats hidden" id="stats-opt2">0% (0)</span>
    </div>

    <div class="option-btn" data-id="opt3">
      <div class="progress-bar" id="bar-opt3"></div>
      <span class="option-label">Bola de chocolate blanco.</span>
      <span class="option-stats hidden" id="stats-opt3">0% (0)</span>
    </div>

    <p id="status-msg" class="status-msg">Elige un producto de tu gusto y haz click en el botón correspondiente para votar.</p>
  </div>

  <script>
    const WIDGET_VOTE_KEY = "widget_user_has_voted";
    const WIDGET_DATA_KEY = "widget_global_poll_counts";

    let globalData = JSON.parse(localStorage.getItem(WIDGET_DATA_KEY)) || {
      opt1: 0,
      opt2: 0,
      opt3: 0
    };

    const options = document.querySelectorAll('.option-btn');
    const statusMsg = document.getElementById('status-msg');

    options.forEach(btn => {
      btn.addEventListener('click', () => {
        if (hasUserVoted()) return;

        const choice = btn.getAttribute('data-id');
        
        globalData[choice]++;
        localStorage.setItem(WIDGET_DATA_KEY, JSON.stringify(globalData));

        localStorage.setItem(WIDGET_VOTE_KEY, "true");

        renderWidgetUI();
      });
    });

    function hasUserVoted() {
      return localStorage.getItem(WIDGET_VOTE_KEY) !== null;
    }

    function renderWidgetUI() {
      const userVoted = hasUserVoted();
      const totalVotes = globalData.opt1 + globalData.opt2 + globalData.opt3;

      Object.keys(globalData).forEach(id => {
        const votes = globalData[id];
        const percentage = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;

        const bar = document.getElementById(`bar-${id}`);
        const stats = document.getElementById(`stats-${id}`);

        if (userVoted) {
          bar.style.width = `${percentage}%`;
          stats.textContent = `${percentage}% (${votes})`;
          stats.classList.remove('hidden');
        }
      });

      if (userVoted) {
        options.forEach(btn => btn.classList.add('disabled'));
        statusMsg.textContent = "Vote recorded. You have already voted!";
      }
    }

    // Initialize state on load
    if (hasUserVoted()) {
      renderWidgetUI();
    }
  </script>

</body>
</html>
